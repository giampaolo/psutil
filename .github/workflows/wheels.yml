# Generates wheels for all platforms, architectures and free-threaded builds,
# tests their native calls, then checks the resulting distribution.
# The broader source suite is run by tests.yml.
#
# Useful URLs:
# * https://github.com/pypa/cibuildwheel
# * https://github.com/astral-sh/setup-uv
# * https://github.com/docker/setup-qemu-action
# * https://github.com/actions/cache
# * https://github.com/actions/checkout
# * https://github.com/actions/download-artifact
# * https://github.com/actions/setup-python
# * https://github.com/actions/upload-artifact

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
name: wheels
concurrency:
  # Cancel run if a new one starts, but don't interrupt all jobs on the first
  # failure.
  group: wheels-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  wheels:
    name: "${{ matrix.osname }} ${{ matrix.arch }}${{ matrix.tag && format(' ({0})', matrix.tag) || '' }}"
    # Forks run manually; upstream skips duplicate same-repo PR runs.
    if: (github.repository == 'giampaolo/psutil' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Reuse each GIL abi3 wheel across all supported Python versions.
      # Free-threaded Python needs its own version-specific wheels.
      matrix:
        include:
          # manylinux and musllinux share a runner, so give them a lane each
          # instead of building one set after the other.
          - {
              os: ubuntu-latest,
              osname: linux,
              arch: x86_64,
              build: &manylinux "cp3{9,10,11,12,13,14,15}-manylinux* cp31{4,5}t-manylinux*",
              tag: manylinux,
            }
          - {
              os: ubuntu-latest,
              osname: linux,
              arch: x86_64,
              build: &musllinux "cp3{9,10,11,12,13,14,15}-musllinux* cp31{4,5}t-musllinux*",
              tag: musllinux,
            }
          - { os: ubuntu-24.04-arm, osname: linux, arch: aarch64, build: *manylinux, tag: manylinux }
          - { os: ubuntu-24.04-arm, osname: linux, arch: aarch64, build: *musllinux, tag: musllinux }
          - { os: ubuntu-latest, osname: linux, arch: ppc64le, build: *manylinux, tag: manylinux, qemu: ppc64le }
          - { os: ubuntu-latest, osname: linux, arch: s390x, build: *manylinux, tag: manylinux, qemu: s390x }
          - { os: macos-15, osname: macos, arch: arm64, build: &abi3 "cp3{9,10,11,12,13,14,15}-*", tag: abi3 }
          - { os: macos-15, osname: macos, arch: arm64, build: &free_threaded "cp31{4,5}t-*", tag: free-threaded }
          - { os: macos-15-intel, osname: macos, arch: x86_64, build: *abi3, tag: abi3 }
          - { os: macos-15-intel, osname: macos, arch: x86_64, build: *free_threaded, tag: free-threaded }
          - { os: windows-2025, osname: win, arch: AMD64, build: *abi3, tag: abi3 }
          - { os: windows-2025, osname: win, arch: AMD64, build: *free_threaded, tag: free-threaded }
          - { os: windows-11-arm, osname: win, arch: ARM64, build: *abi3, tag: abi3 }
          - { os: windows-11-arm, osname: win, arch: ARM64, build: *free_threaded, tag: free-threaded }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.qemu }}

      # Cache the CPython interpreters cibuildwheel downloads, so later pushes
      # reuse them. Windows only: Linux takes them from the container, and
      # macOS installs a .pkg into /Library/Frameworks, leaving nothing behind
      # to cache. Worth ~90 secs on Windows, measured by removing it (see
      # #2931).
      - name: Cache cibuildwheel interpreters
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cibw-cache
          # Refresh the cache every time wheels.yml or pyproject.toml change.
          # restore-keys falls back to the previous entry meanwhile, so an
          # unrelated edit doesn't mean re-downloading everything.
          key: cibw-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.tag || 'all' }}-${{ hashFiles('.github/workflows/wheels.yml', 'pyproject.toml') }}
          restore-keys: cibw-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.tag || 'all' }}-

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Not pypa/cibuildwheel: that action pip-installs itself from an sdist on
      # every lane, which takes ~18 secs instead of ~5.
      - name: Build wheels
        shell: bash
        run: uv run --only-group wheels cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: "${{ matrix.arch }}"
          CIBW_BUILD: "${{ matrix.build }}"
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -m pytest -q -o addopts= --noconftest --import-mode=importlib
            {project}/tests/test_free_threaded.py -k fresh_import_and_concurrent_process_queries
          # Disabled, "make ci-check-dist" does it already.
          CIBW_AUDIT_COMMAND: ""
          # Pin it, else it follows whichever Python builds the wheel.
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=10.15
          # We only link Windows system DLLs, so there's nothing for delvewheel
          # to bundle.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.tag || 'all' }}
          path: wheelhouse
          compression-level: 0

  # Merge wheels and check sanity of the package distribution.
  check-dist:
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true
      - run: |
          make ci-check-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/*.whl
          compression-level: 0
