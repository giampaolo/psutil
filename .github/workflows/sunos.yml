# Execute tests on SunOS
# https://github.com/vmactions/solaris-vm

name: sunos
on:
  workflow_dispatch:
  push:
    # only run this job if the following files are modified
    paths: &sunos_paths
      - ".github/workflows/sunos.yml"
      - "Makefile"
      - "psutil/__init__.py"
      - "psutil/_common.py"
      - "psutil/_ntuples.py"
      - "psutil/_psposix.py"
      - "psutil/_pssunos.py"
      - "psutil/_psutil_sunos.c"
      - "psutil/arch/all/**"
      - "psutil/arch/posix/**"
      - "psutil/arch/sunos/**"
      - "pyproject.toml"
      - "scripts/internal/install-pydeps.sh"
      - "scripts/internal/install-sysdeps.sh"
      - "setup.py"
  pull_request:
    paths: *sunos_paths
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || '' }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    # Forks run manually; upstream skips duplicate same-repo PR runs.
    if: (github.repository == 'giampaolo/psutil' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        id: test
        uses: vmactions/solaris-vm@87d3c436511cef802cd1637f86f73b1a97715c8c # v1.4.1
        with:
          release: "11.4-gcc"
          usesh: true
          run: |
            set -x
            pkg install --accept developer/build/gnu-make runtime/python-311 || [ "$?" -eq 4 ]
            gmake build PYTHON=python3.11
            gmake install-pydeps-test PYTHON=python3.11
            gmake test-memleaks-parallel PYTHON=python3.11
