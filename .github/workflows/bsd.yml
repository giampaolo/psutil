# Execute tests on *BSD platforms. Does not produce wheels.
# Useful URLs:
# https://github.com/vmactions/freebsd-vm
# https://github.com/vmactions/openbsd-vm
# https://github.com/vmactions/netbsd-vm

on:
  workflow_dispatch:
  push:
    # only run this job if the following files are modified
    paths: &bsd_paths
      - ".github/workflows/bsd.yml"
      - "Makefile"
      - "psutil/__init__.py"
      - "psutil/_common.py"
      - "psutil/_ntuples.py"
      - "psutil/_psbsd.py"
      - "psutil/_psposix.py"
      - "psutil/_psutil_bsd.c"
      - "psutil/arch/*bsd*/**"
      - "psutil/arch/*posix*/**"
      - "psutil/arch/all/**"
      - "pyproject.toml"
      - "scripts/internal/install-sysdeps.sh"
      - "setup.py"
      - "tests/**"
  pull_request:
    paths: *bsd_paths
name: bsd
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || '' }}
  cancel-in-progress: true
jobs:
  freebsd:
    # if: false
    # Skip same-repo PR runs: the push event already covers them.
    if: &skip_same_repo_pr github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          run: |
            make ci-test

  openbsd:
    # if: false
    if: *skip_same_repo_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          run: |
            make ci-test

  netbsd:
    # if: false
    if: *skip_same_repo_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          run: |
            make ci-test
