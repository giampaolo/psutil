# Execute tests on *BSD platforms. Does not produce wheels.
# Useful URLs:
# https://github.com/vmactions/freebsd-vm
# https://github.com/vmactions/openbsd-vm
# https://github.com/vmactions/netbsd-vm

on:
  workflow_dispatch:
  push:
    # only run this job if the following files are modified
    paths: &bsd_paths
      - ".github/workflows/bsd.yml"
      - "Makefile"
      - "psutil/__init__.py"
      - "psutil/_common.py"
      - "psutil/_ntuples.py"
      - "psutil/_psbsd.py"
      - "psutil/_psposix.py"
      - "psutil/_psutil_bsd.c"
      - "psutil/arch/*bsd*/**"
      - "psutil/arch/*posix*/**"
      - "psutil/arch/all/**"
      - "pyproject.toml"
      - "scripts/internal/install-pydeps.sh"
      - "scripts/internal/install-sysdeps.sh"
      - "setup.py"
      - "tests/**"
  pull_request:
    paths: *bsd_paths
name: bsd
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || '' }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  freebsd:
    # if: false
    # Forks run manually; upstream skips duplicate same-repo PR runs.
    if: &skip_same_repo_pr (github.repository == 'giampaolo/psutil' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name !=
      github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          run: |
            make ci-install
            pw useradd -n tester -m
            chown -R tester .
            su tester -c "cd $(pwd) && LOGNAME=tester make test-parallel"
            su tester -c "cd $(pwd) && LOGNAME=tester make test-memleaks-parallel"

  openbsd:
    # if: false
    if: *skip_same_repo_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          usesh: true
          run: |
            make ci-install
            useradd -m tester
            chown -R tester .
            su tester -c "cd $(pwd) && make test-parallel"
            su tester -c "cd $(pwd) && make test-memleaks-parallel"

  netbsd:
    # if: false
    if: *skip_same_repo_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          usesh: true
          run: |
            make ci-install
            useradd -m tester
            chown -R tester .
            su tester -c "cd $(pwd) && make test-parallel"
            su tester -c "cd $(pwd) && make test-memleaks-parallel"
